  - resource: "http://192.168.1.26:1984/api/streams"
    scan_interval: 10
    timeout: 5
    sensor:
      - name: 1621 Go2RTC Active Streams
        value_template: >
          {% set active = namespace(count=0) %}
          {% for stream in value_json.values() %}
          {% if stream.consumers is iterable and stream.consumers | count > 0 %}
          {% set active.count = active.count + 1 %}
          {% endif %}
          {% endfor %}
          {{ active.count }}

  - resource: "http://192.168.1.14:1984/api/streams"
    scan_interval: 15
    timeout: 5
    sensor:
      - name: Main Go2RTC Active Streams
        value_template: >
          {% set active = namespace(count=0) %}
          {% for stream in value_json.values() %}
          {% if stream.consumers is iterable and stream.consumers | count > 0 %}
          {% set active.count = active.count + 1 %}
          {% endif %}
          {% endfor %}
          {{ active.count }}

  - resource: "http://192.168.1.34:1984/api/streams"
    scan_interval: 15
    timeout: 5
    sensor:
      - name: Backup Go2RTC Active Streams
        value_template: >
          {% set active = namespace(count=0) %}
          {% for stream in value_json.values() %}
          {% if stream.consumers is iterable and stream.consumers | count > 0 %}
          {% set active.count = active.count + 1 %}
          {% endif %}
          {% endfor %}
          {{ active.count }}

  - resource: !secret proxy_suspects_url
    headers:
      X-Site-Token: !secret proxy_sites_token
    scan_interval: 900
    timeout: 30
    sensor:
      - name: proxy_suspects
        unique_id: proxy_suspects
        icon: mdi:account-alert
        # HTTP errors (502 when proxyadmin is down, 403, 429) come with an HTML body: unavailable, not an empty state
        availability: "{{ value_json is mapping and value_json.ips is defined }}"
        value_template: "{{ value_json.ips }}"
        json_attributes:
          - items
          - new

  - resource: "https://api.deepseek.com/user/balance"
    headers:
      Authorization: !secret deepseek_api_key
    scan_interval: 3600
    timeout: 20
    sensor:
      - name: DeepSeek Balance USD
        unique_id: deepseek_balance_usd
        icon: mdi:cash-multiple
        device_class: monetary
        state_class: measurement
        unit_of_measurement: USD
        availability: >-
          {{ value_json is mapping and value_json.balance_infos is iterable
             and value_json.balance_infos | selectattr('currency', 'eq', 'USD') | list | count > 0 }}
        value_template: >-
          {{ (value_json.balance_infos | selectattr('currency', 'eq', 'USD') | list | first | default({})).get('total_balance') | float(0) }}
