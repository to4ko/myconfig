  - resource: "http://192.168.1.26:1984/api/streams"
    scan_interval: 10
    timeout: 5
    sensor:
      - name: 1621 Go2RTC Active Streams
        value_template: >
          {% set active = namespace(count=0) %}
          {% for stream in value_json.values() %}
          {% if stream.consumers is iterable and stream.consumers | count > 0 %}
          {% set active.count = active.count + 1 %}
          {% endif %}
          {% endfor %}
          {{ active.count }}

  - resource: "http://192.168.1.14:1984/api/streams"
    scan_interval: 15
    timeout: 5
    sensor:
      - name: Main Go2RTC Active Streams
        value_template: >
          {% set active = namespace(count=0) %}
          {% for stream in value_json.values() %}
          {% if stream.consumers is iterable and stream.consumers | count > 0 %}
          {% set active.count = active.count + 1 %}
          {% endif %}
          {% endfor %}
          {{ active.count }}

  - resource: "http://192.168.1.34:1984/api/streams"
    scan_interval: 15
    timeout: 5
    sensor:
      - name: Backup Go2RTC Active Streams
        value_template: >
          {% set active = namespace(count=0) %}
          {% for stream in value_json.values() %}
          {% if stream.consumers is iterable and stream.consumers | count > 0 %}
          {% set active.count = active.count + 1 %}
          {% endif %}
          {% endfor %}
          {{ active.count }}

  # Yandex Cloud status board (public API, installation ru). One request feeds all entities below.
  # An incident counts as active while it has no endDate (same rule as the site), even if its status is already 'resolved'.
  - resource: "https://status.yandex.cloud/api/services?installation=ru"
    scan_interval: 300
    timeout: 30
    sensor:
      - name: "Yandex Cloud: открытых инцидентов"
        unique_id: yandex_cloud_open_incidents
        icon: mdi:cloud-alert
        state_class: measurement
        value_template: >-
          {{ value_json | selectattr('installationCode','eq','ru') | map(attribute='incidents') | sum(start=[]) | rejectattr('status','eq','draft') | selectattr('endDate','none') | map(attribute='id') | unique | list | count }}

      - name: "Yandex Cloud: заголовки инцидентов"
        unique_id: yandex_cloud_incident_titles
        icon: mdi:cloud-alert-outline
        value_template: >-
          {{ (value_json | selectattr('installationCode','eq','ru') | map(attribute='incidents') | sum(start=[]) | rejectattr('status','eq','draft') | selectattr('endDate','none') | map(attribute='title') | unique | list | join('; '))[:250] or 'нет' }}

      - name: "Yandex Cloud: new services"
        unique_id: yandex_cloud_new_services
        icon: mdi:cloud-plus
        value_template: >-
          {{ (value_json | selectattr('installationCode','eq','ru') | map(attribute='slug') | list | reject('in', ['ai-studio', 'api-gateway', 'application-load-balancer', 'audit-trails', 'backup', 'baremetal', 'billing', 'cdn', 'certificate-manager', 'cloud-apps', 'cloud-desktop', 'cloud-registry', 'cloud-router', 'code-assistant', 'compute', 'console', 'container-registry', 'data-proc', 'data-streams', 'data-transfer', 'datalens', 'datasphere', 'dns', 'forms', 'functions', 'gost-gateway', 'iam', 'interconnect', 'iot-core', 'kms', 'lockbox', 'logging', 'managed-airflow', 'managed-clickhouse', 'managed-gitlab', 'managed-greenplum', 'managed-kafka', 'managed-kubernetes', 'managed-mysql', 'managed-opensearch', 'managed-postgresql', 'managed-prometheus', 'managed-spark', 'managed-spqr', 'managed-trino', 'managed-valkey', 'managed-ytsaurus', 'marketplace', 'message-queue', 'metadata-hub', 'monitoring', 'monium', 'network-load-balancer', 'neurosupport', 'notifications', 'organization', 'postbox', 'query', 'quota-manager', 'resource-manager', 'search-api', 'security-deck', 'serverless-containers', 'siem', 'smartcaptcha', 'smartwebsecurity', 'sourcecraft', 'speechkit', 'speechsense', 'stackland', 'storage', 'storedoc', 'support', 'tracker', 'translate', 'vibecraft', 'video', 'vision', 'vpc', 'websql', 'wiki', 'yandexgpt', 'ycdr', 'ydb']) | list | join(', '))[:250] or 'none' }}

