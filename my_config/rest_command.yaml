  # UniFi proxy on aeza (https://unifi.to4ko.ru): addresses of the sites with changing IPs (Dacha, Parents, Lena, Vova)
  # for its whitelist. The proxy takes only public addresses of known sites and checks the token.
  # Called by automation system_proxy_site_ips with ips = state of sensor.site_magic_ips.
  proxy_site_ips:
    url: "https://unifi.to4ko.ru/api/sites"
    method: post
    headers:
      X-Site-Token: !secret proxy_sites_token
    content_type: "application/json"
    payload: '{"ips": "{{ ips }}"}'
    timeout: 20

  # UniFi proxy on aeza: daily digest of who used the proxy from abroad (last 24 h, Russia and Belarus left out).
  # The proxy builds the ready Russian text; automation system_proxy_foreign_report sends it to Telegram at 10:00.
  proxy_foreign_report:
    url: "https://unifi.to4ko.ru/api/report"
    method: get
    headers:
      X-Site-Token: !secret proxy_sites_token
    timeout: 60
