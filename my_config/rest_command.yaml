  proxy_site_ips:
    url: "https://unifi.to4ko.ru/api/sites"
    method: post
    headers:
      X-Site-Token: !secret proxy_sites_token
    content_type: "application/json"
    payload: '{"ips": "{{ ips }}"}'
    timeout: 20

  proxy_foreign_report:
    url: "https://unifi.to4ko.ru/api/report"
    method: get
    headers:
      X-Site-Token: !secret proxy_sites_token
    timeout: 60
