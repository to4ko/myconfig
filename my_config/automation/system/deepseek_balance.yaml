# #####################################################################################
#
# SYSTEM - DeepSeek platform balance
#
# #####################################################################################
- alias: system_deepseek_balance_low
  id: system_deepseek_balance_low
  initial_state: true
  mode: single
  triggers:
    - trigger: numeric_state
      entity_id: sensor.deepseek_balance_usd
      below: 5
  conditions:
    - condition: template
      value_template: >-
        {{ trigger.from_state is not none
           and trigger.from_state.state not in ['unavailable', 'unknown'] }}
  actions:
    - action: notify.send_message
      data:
        entity_id: notify.telegram_dima
        message: "\U0001f4b0 DeepSeek: баланс {{ states('sensor.deepseek_balance_usd') }} USD — ниже порога. Пополни: https://platform.deepseek.com/"
