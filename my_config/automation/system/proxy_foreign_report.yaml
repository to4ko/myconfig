# #####################################################################################
#
# SYSTEM - UniFi proxy foreign report
#
# #####################################################################################
# Once a day at 10:00 the proxy (https://unifi.to4ko.ru) is asked for a digest of the last 24 h: how many
# addresses and how much traffic came from abroad, split by country, with Russia and Belarus left out, plus the
# biggest addresses and how many of them are Russian operators on rented foreign blocks.
# The text is built by the proxy (/api/report, token checked); here it is only forwarded to Telegram.
# Country = where the address block is registered, not where the user sits, so VPNs and rented blocks blur it.
# ##################################
- alias: system_proxy_foreign_report
  id: system_proxy_foreign_report
  initial_state: true
  mode: single
  triggers:
    - trigger: time
      at: "10:00:00"
  actions:
    - action: rest_command.proxy_foreign_report
      response_variable: rep
      continue_on_error: true
    # the proxy is unreachable or answered with an error: say nothing, the link automation already reports outages
    # (Home Assistant parses a JSON response itself, so rep.content is a dict, not a string)
    - condition: template
      value_template: >-
        {{ rep is defined and rep.status == 200 and rep.content is defined
           and rep.content is mapping and rep.content.text is defined and rep.content.text | length > 20 }}
    - action: notify.send_message
      data:
        entity_id: notify.telegram_dima
        message: "{{ rep.content.text }}"
