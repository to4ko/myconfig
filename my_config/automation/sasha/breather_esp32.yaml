# #####################################################################################
#
# Sasha - breather
#
# #####################################################################################
# Sasha- breather auto co2
# ##################################
  - alias: sasha_breather_auto_co2_esp32
    id: sasha_breather_auto_co2_esp32
    initial_state: true
    triggers:
      - trigger: time_pattern
        minutes: '/3'
    conditions:
      - condition: state
        entity_id: switch.system_breather_auto_s
        state: 'on'
      - condition: not
        conditions:
          - condition: state
            entity_id: switch.system_breather_manual_s
            state: 'on'
    actions:
      - choose:
          - conditions:
              - condition: state
                entity_id: binary_sensor.0x00158d00025370d1_contact
                state: 'off'
              - condition: numeric_state
                entity_id: sensor.esp32_node_s_co2
                above: input_number.co2_high_limit
              - condition: state
                entity_id: binary_sensor.breather_s
                state: 'off'
              - condition: state
                entity_id: switch.system_security_mode
                state: 'off'
              - condition: numeric_state
                entity_id: sensor.0x00158d0001e6d85a_temperature
                above: 20
            sequence:
              - action: climate.turn_on
                target:
                  entity_id: climate.esp32_breather_s
              - action: climate.set_hvac_mode
                target:
                  entity_id:
                    - climate.esp32_breather_s
                data:
                  hvac_mode: fan_only
              - condition: numeric_state
                entity_id: sensor.esp32_node_s_co2
                above: input_number.co2_high_limit
              - condition: state
                entity_id: switch.system_breather_auto_speed_s
                state: 'on'
              - action: climate.set_fan_mode
                target:
                  entity_id: climate.esp32_breather_s
                data:
                  fan_mode: "{{ (states('sensor.breather_set_speed_s')|int(0) / 25)|round(0,'floor')|int }}"

          - conditions:
              - condition: state
                entity_id: binary_sensor.0x00158d00025370d1_contact
                state: 'off'
              - condition: numeric_state
                entity_id: sensor.esp32_node_s_co2
                above: input_number.co2_high_limit
              - condition: state
                entity_id: binary_sensor.breather_s
                state: 'on'
              - condition: state
                entity_id: switch.system_security_mode
                state: 'off'
              - condition: state
                entity_id: switch.system_breather_auto_speed_s
                state: 'on'
              - condition: numeric_state
                entity_id: sensor.breather_set_speed_s
                above: 0
            sequence:
              - action: climate.set_fan_mode
                target:
                  entity_id: climate.esp32_breather_s
                data:
                  fan_mode: "{{ (states('sensor.breather_set_speed_s')|int(0) / 25)|round(0,'floor')|int }}"

          - conditions:
              - or:
                  - and:
                      - condition: state
                        entity_id: binary_sensor.0x00158d00025370d1_contact
                        state: 'off'
                      - condition: numeric_state
                        entity_id: sensor.esp32_node_s_co2
                        below: input_number.co2_low_limit
                      - condition: state
                        entity_id: binary_sensor.breather_s
                        state: 'on'
                  - and:
                      - or:
                          - condition: numeric_state
                            entity_id: sensor.0x00158d0001e6d85a_temperature
                            below: 20
                          - condition: state
                            entity_id: binary_sensor.0x00158d00025370d1_contact
                            state: 'on'
                      - condition: state
                        entity_id: binary_sensor.breather_s
                        state: 'on'
            sequence:
              - action: climate.turn_off
                target:
                  entity_id: climate.esp32_breather_s

# ##################################
# Sasha - Breather Auto Timer
# ##################################
  - alias: sasha_breather_auto_timer_esp32
    id: sasha_breather_auto_timer_esp32
    mode: single
    max_exceeded: silent
    initial_state: true
    triggers:
      - trigger: event
        event_type: yandex_intent
        event_data:
          text: Выключи вентиляцию
        id: 'to_off_alice'
      - trigger: event
        event_type: yandex_intent
        event_data:
          text: Включи вентиляцию
        id: 'to_on_alice'
      - trigger: time
        at: "21:00:00"
        id: 'time_trigger_night'
      - trigger: time
        at: "09:00:00"
        id: 'time_trigger_day'
    actions:
      - choose:
          - conditions: # choice 5
              - condition: trigger
                id: "to_off_alice"
            sequence:
              - condition: template
                value_template: "{{ trigger.event.data.entity_id == 'media_player.yandex_s' }}"

              - if:
                  - condition: state
                    entity_id: binary_sensor.breather_s
                    state: 'on'
                then:
                  - action: climate.turn_off
                    target:
                      entity_id: climate.esp32_breather_s

              - action: switch.turn_on
                entity_id: switch.system_breather_auto_s

          - conditions: # choice 6
              - condition: trigger
                id: 'to_on_alice'
            sequence:
              - condition: template
                value_template: "{{ trigger.event.data.entity_id == 'media_player.yandex_s' }}"

              - if:
                  - condition: state
                    entity_id: binary_sensor.breather_s
                    state: 'off'
                then:
                  - action: switch.turn_on
                    entity_id: switch.system_breather_manual_s
                  - action: climate.set_hvac_mode
                    target:
                      entity_id: climate.esp32_breather_s
                    data:
                      hvac_mode: fan_only

          - conditions: # choice 8
              - condition: trigger
                id: "time_trigger_night"
            sequence:
              - action: switch.turn_on
                entity_id: switch.system_breather_manual_s
              - action: climate.set_fan_mode
                target:
                  entity_id: climate.esp32_breather_s
                data:
                  fan_mode: "1"

          - conditions: # choice 9
              - condition: trigger
                id: "time_trigger_day"
            sequence:
              - action: climate.set_hvac_mode
                target:
                  entity_id: climate.esp32_breather_s
                data:
                  hvac_mode: 'off'

# ##################################
# Sasha - Breather Switches Interlock  (no fan/climate action — unchanged logic)
# ##################################
  - alias: sasha_breather_switches_interlock_esp32
    id: sasha_breather_switches_interlock_esp32
    mode: single
    max_exceeded: silent
    initial_state: true
    triggers:
      - trigger: state
        entity_id:
          - switch.system_breather_auto_s
          - switch.system_breather_manual_s
    conditions:
      - condition: template
        value_template: "{{ trigger.to_state.state == 'on' }}"
    actions:
      - action: homeassistant.turn_off
        target:
          entity_id: >-
            {% if trigger.from_state.entity_id == 'switch.system_breather_auto_s' %}
            {{ 'switch.system_breather_manual_s' }}
            {% else %}
            {{ 'switch.system_breather_auto_s' }}
            {% endif %}

# ##################################
# Sasha - Breather Switches to default  (no fan/climate action — unchanged logic)
# ##################################
  - alias: sasha_breather_switches_default_esp32
    id: sasha_breather_switches_default_esp32
    mode: single
    max_exceeded: silent
    initial_state: true
    triggers:
      - trigger: template
        value_template: "{{ is_state('switch.system_breather_auto_s','off') and
                            is_state('switch.system_breather_manual_s','off') }}"
    actions:
    - action: switch.turn_on
      entity_id: switch.system_breather_auto_s
