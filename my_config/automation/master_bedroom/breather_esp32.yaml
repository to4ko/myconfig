# #####################################################################################
#
# MASTER BEDROOM - breather
#
# #####################################################################################
# Master Bedroom- breather auto co2
# ##################################
  - alias: master_bedroom_breather_auto_co2_esp32
    id: master_bedroom_breather_auto_co2_esp32
    initial_state: true
    triggers:
      - trigger: time_pattern
        minutes: '/3'
    conditions:
      - condition: state
        entity_id: switch.system_breather_auto_mb
        state: 'on'
      - condition: not
        conditions:
          - condition: state
            entity_id: switch.system_breather_manual_mb
            state: 'on'
    actions:
      - choose:
          - conditions:
              - condition: state
                entity_id: binary_sensor.0x00158d000200ad58_contact
                state: 'off'
              - condition: numeric_state
                entity_id: sensor.esp32_node_mb_co2
                above: input_number.co2_high_limit
              - condition: state
                entity_id: binary_sensor.breather_mb
                state: 'off'
              - condition: state
                entity_id: switch.system_security_mode
                state: 'off'
              - condition: numeric_state
                entity_id: sensor.0x00158d000222c746_temperature
                above: 20
            sequence:
              - action: climate.set_hvac_mode
                target:
                  entity_id: climate.esp32_breather_mb
                data:
                  hvac_mode: fan_only
              - condition: numeric_state
                entity_id: sensor.esp32_node_mb_co2
                above: input_number.co2_high_limit
              - condition: state
                entity_id: switch.system_breather_auto_speed_mb
                state: 'on'
              - action: climate.set_fan_mode
                target:
                  entity_id: climate.esp32_breather_mb
                data:
                  fan_mode: "{{ (states('sensor.breather_set_speed_mb')|int(0) / 25)|round(0,'floor')|int }}"

          - conditions:
              - condition: state
                entity_id: binary_sensor.0x00158d000200ad58_contact
                state: 'off'
              - condition: numeric_state
                entity_id: sensor.esp32_node_mb_co2
                above: input_number.co2_high_limit
              - condition: state
                entity_id: binary_sensor.breather_mb
                state: 'on'
              - condition: state
                entity_id: switch.system_security_mode
                state: 'off'
              - condition: state
                entity_id: switch.system_breather_auto_speed_mb
                state: 'on'
              - condition: numeric_state
                entity_id: sensor.breather_set_speed_mb
                above: 0
            sequence:
              - action: climate.set_fan_mode
                target:
                  entity_id: climate.esp32_breather_mb
                data:
                  fan_mode: "{{ (states('sensor.breather_set_speed_mb')|int(0) / 25)|round(0,'floor')|int }}"

          - conditions:
              - or:
                  - and:
                      - condition: state
                        entity_id: binary_sensor.0x00158d000200ad58_contact
                        state: 'off'
                      - condition: numeric_state
                        entity_id: sensor.esp32_node_mb_co2
                        below: input_number.co2_low_limit
                      - condition: state
                        entity_id: binary_sensor.breather_mb
                        state: 'on'
                  - and:
                      - or:
                          - condition: numeric_state
                            entity_id: sensor.0x00158d000222c746_temperature
                            below: 20
                          - condition: state
                            entity_id: binary_sensor.0x00158d000200ad58_contact
                            state: 'on'
                      - condition: state
                        entity_id: binary_sensor.breather_mb
                        state: 'on'
            sequence:
              - action: climate.set_hvac_mode
                target:
                  entity_id: climate.esp32_breather_mb
                data:
                  hvac_mode: 'off'

# ##################################
# Master bedroom  - Breather Auto Timer
# ##################################
  - alias: master_bedroom_breather_auto_timer_esp32
    id: master_bedroom_breather_auto_timer_esp32
    mode: single
    max_exceeded: silent
    initial_state: true
    triggers:
      - trigger: event
        event_type: yandex_intent
        event_data:
          text: Выключи вентиляцию
        id: 'to_off_alice'
      - trigger: event
        event_type: yandex_intent
        event_data:
          text: Включи вентиляцию
        id: 'to_on_alice'
      # - trigger: time
      #   at: "21:00:00"
      #   id: 'time_trigger_night'
      # NOTE: night trigger is commented out here exactly as in the original
      # breather.yaml (already flagged separately) — not something this
      # migration is meant to fix. Left as-is.
      - trigger: time
        at: "09:00:00"
        id: 'time_trigger_day'
    actions:
      - choose:
          - conditions: # choice 5
              - condition: trigger
                id: "to_off_alice"
            sequence:
              - condition: template
                value_template: "{{ trigger.event.data.entity_id == 'media_player.yandex_mb' }}"

              - if:
                  - condition: state
                    entity_id: binary_sensor.breather_mb
                    state: 'on'
                then:
                  - action: climate.set_hvac_mode
                    target:
                      entity_id: climate.esp32_breather_mb
                    data:
                      hvac_mode: 'off'

              - action: switch.turn_on
                entity_id: switch.system_breather_auto_mb

          - conditions: # choice 6
              - condition: trigger
                id: 'to_on_alice'
            sequence:
              - condition: template
                value_template: "{{ trigger.event.data.entity_id == 'media_player.yandex_mb' }}"

              - if:
                  - condition: state
                    entity_id: binary_sensor.breather_mb
                    state: 'off'
                then:
                  - action: climate.set_hvac_mode
                    target:
                      entity_id: climate.esp32_breather_mb
                    data:
                      hvac_mode: fan_only
                  - action: switch.turn_on
                    entity_id: switch.system_breather_manual_mb

          - conditions: # choice 8 (unreachable — see note above on the disabled trigger)
              - condition: trigger
                id: "time_trigger_night"
            sequence:
              - action: switch.turn_on
                entity_id: switch.system_breather_manual_mb
              - action: climate.set_fan_mode
                target:
                  entity_id: climate.esp32_breather_mb
                data:
                  fan_mode: "2"

          - conditions: # choice 9
              - condition: trigger
                id: "time_trigger_day"
            sequence:
              - action: climate.set_hvac_mode
                target:
                  entity_id: climate.esp32_breather_mb
                data:
                  hvac_mode: 'off'

# ##################################
# Master Bedroom - Breather Switches Interlock  (no fan/climate action — unchanged logic)
# ##################################
  - alias: master_bedroom_breather_switches_interlock_esp32
    id: master_bedroom_breather_switches_interlock_esp32
    mode: single
    max_exceeded: silent
    initial_state: true
    triggers:
      - trigger: state
        entity_id:
          - switch.system_breather_auto_mb
          - switch.system_breather_manual_mb
    conditions:
      - condition: template
        value_template: "{{ trigger.to_state.state == 'on' }}"
    actions:
    - action: homeassistant.turn_off
      target:
        entity_id: >-
          {% if trigger.from_state.entity_id == 'switch.system_breather_auto_mb' %}
          {{ 'switch.system_breather_manual_mb' }}
          {% else %}
          {{ 'switch.system_breather_auto_mb' }}
          {% endif %}

# ##################################
# Master Bedroom - Breather Switches to default  (no fan/climate action — unchanged logic)
# ##################################
  - alias: master_bedroom_breather_switches_default_esp32
    id: master_bedroom_breather_switches_default_esp32
    mode: single
    max_exceeded: silent
    initial_state: true
    triggers:
      - trigger: template
        value_template: "{{ is_state('switch.system_breather_auto_mb','off') and
                            is_state('switch.system_breather_manual_mb','off') }}"
    actions:
    - action: switch.turn_on
      entity_id: switch.system_breather_auto_mb
