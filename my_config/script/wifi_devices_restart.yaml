square_led_v_restart:
  alias: Square LED V Restart
  sequence:
    - if:
        - condition: template
          value_template: >
            {% set ignore = ['unknown', 'unavailable', 'none'] %}
            {{ states('switch.shelly_1pm_led_v') not in ignore }}
      then:
        - action: switch.turn_off
          entity_id: switch.shelly_1pm_led_v
        - delay: 00:00:15
        - action: switch.turn_on
          entity_id: switch.shelly_1pm_led_v
        - delay: 00:00:10
        - action: homeassistant.reload_config_entry
          data:
            entry_id: eb2a45fffb7b11ea98f7636dd025370d
        - action: notify.send_message
          data:
            entity_id: notify.telegram_dima
            message: "\U0001f6a8 Square LED V restart done!"
      else:
        - action: notify.send_message
          data:
            entity_id: notify.telegram_dima
            message: "\U0001f6a8 Square LED V розетка недоступна! Перезапуск отменен!"

