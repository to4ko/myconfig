  text_to_tts:
    alias: Text To TTS
    sequence:
    - choose:
      - conditions:
        - condition: state
          entity_id: input_select.tts_audio_mode
          state: Текст
        sequence:
        - action: media_player.play_media
          data:
            media_content_type: dialog
            entity_id: media_player.{{states('input_select.tts_audio_out')|lower}}
            media_content_id: '{%- if states(''sensor.tts_audio_effect'') != ''none'' %}<speaker effect="{{states(''sensor.tts_audio_effect'')}}">{%endif%}{{
              states(''input_text.text_to_tts'') }}'
            extra:
              volume_level: '{{states("input_number.tts_volume")|float(0)}}'
      - conditions:
        - condition: state
          entity_id: input_select.tts_audio_mode
          state: Команда
        sequence:
        - action: media_player.play_media
          data:
            media_content_type: command
            entity_id: media_player.{{states('input_select.tts_audio_out')|lower}}
            media_content_id: '{{ states(''input_text.text_to_tts'') }}'
            extra:
              volume_level: '{{states("input_number.tts_volume")|float(0)}}'
      - conditions:
        - condition: state
          entity_id: input_select.tts_audio_mode
          state: Вопрос
        sequence:
        - variables:
            question_player: '{{ ''media_player.'' ~ states(''input_select.tts_audio_out'') | lower }}'
            question_idle_sensor: '{{ ''sensor.'' ~ states(''input_select.tts_audio_out'') | lower ~ ''_alice_state''
              }}'
            question_saved_volume: '{{ state_attr(question_player, ''volume_level'') }}'
        - condition: template
          value_template: '{{ is_number(question_saved_volume) }}'
        - action: media_player.volume_set
          continue_on_error: true
          data:
            entity_id: '{{ question_player }}'
            volume_level: 0
        - action: media_player.play_media
          continue_on_error: true
          data:
            entity_id: '{{ question_player }}'
            media_content_id: '{{ states(''input_text.text_to_tts'') }}'
            media_content_type: question:tts_reply
        - delay:
            seconds: 1
        - wait_template: '{{ is_state(question_idle_sensor, ''idle'') or not has_value(question_player) }}'
          timeout: 00:02:00
          continue_on_timeout: true
        - action: media_player.play_media
          continue_on_error: true
          data:
            entity_id: '{{ question_player }}'
            media_content_type: command
            media_content_id: Алиса, Стоп
            extra:
              volume_level: 0
        - delay:
            seconds: 3
        - action: media_player.volume_set
          continue_on_error: true
          data:
            entity_id: '{{ question_player }}'
            volume_level: '{{ question_saved_volume | float }}'
    description: В режиме вопроса громкость сохраняется локально; ожидание ограничено и возврат громкости выполняется
      после таймаута.

  alice_question:
    alias: Question to Alice
    sequence:
      - action: media_player.play_media
        entity_id: media_player.yandex_k
        data:
          media_content_id: "{{ trigger.event.data.text }}"
          media_content_type: "question:{{ trigger.event.data.chat_id }}"
      - wait_for_trigger:
          platform: event
          event_type: yandex_station_response
        timeout: "00:01:00"
        continue_on_timeout: false
      - action: input_text.set_value
        entity_id: input_text.tts_to_text
        data:
          value: "{{ trigger.event.data.text }}"


  tts_out:
    alias: TTS Out script
    mode: parallel
    max: 100
    max_exceeded: silent
    fields:
      entity:
        description: 'entity_id колонки'
        example: 'media_player.yandex_hb'
        default: media_player.{{states('input_select.tts_audio_out')|lower}}
      text:
        description: 'Текст для воспроизведения'
        example: 'Внимание! Важное сообщение...'
      vol_level:
        description: 'Уровень громкости'
        example: '0.8'
        default: "{{states('input_number.tts_volume')|float(0)}}"
    sequence:
       - action: media_player.play_media
         data:
           entity_id: '{{ entity }}'
           media_content_id: '{{ text }}'
           media_content_type: text
           extra:
             volume_level: '{{ vol_level }}'