  # Тап по "Fan B" на дашборде: крутится — выключить (ручной режим прошивка снимет сама,
  # по влажности авто может включить обратно), стоит — ручной режим из прошивки ESP
  bathroom_fan_b_tap:
    alias: Bathroom Fan B Tap
    mode: single
    max_exceeded: silent
    sequence:
      - if:
          - condition: state
            entity_id: fan.esp32_node_b_fan_b
            state: "on"
        then:
          - action: fan.turn_off
            target:
              entity_id: fan.esp32_node_b_fan_b
        else:
          - action: switch.turn_on
            target:
              entity_id: switch.esp32_node_b_fan_b_manual_mode
