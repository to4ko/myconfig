open_door_photo:
  alias: Open Door Photos
  sequence:
    - delay: 00:00:03
    - variables:
        snapshot_url: http://localhost:1984/api/frame.jpeg?src=g5_entrance #!secret entrance_snap
        snapshot_caption: "\U0001f4f7 Вход"
        snapshot_chat_id: !secret tel_chat_id
        snapshot_photo_result: null
    - &send_snapshot_photo
      action: telegram_bot.send_photo
      continue_on_error: true
      response_variable: snapshot_photo_result
      data:
        url: "{{ snapshot_url }}"
        caption: "{{ snapshot_caption }}"
        chat_id: "{{ snapshot_chat_id }}"
    - &retry_snapshot_photo_if_needed
      enabled: false
      if:
        - condition: template
          value_template: "{{ not (snapshot_photo_result or {}).get('chats') }}"
      then:
        - alias: "Повтор снимка в Telegram (1920)"
          sequence:
            - action: telegram_bot.send_photo
              continue_on_error: true
              response_variable: snapshot_photo_result
              data:
                url: "{{ snapshot_url }}&width=1920"
                caption: "{{ snapshot_caption }}"
                chat_id: "{{ snapshot_chat_id }}"
        - condition: template
          value_template: "{{ not (snapshot_photo_result or {}).get('chats') }}"
        - action: telegram_bot.send_photo
          data:
            url: "{{ snapshot_url }}&width=1280"
            caption: "{{ snapshot_caption }}"
            chat_id: "{{ snapshot_chat_id }}"
    - variables:
        snapshot_url: http://localhost:1984/api/frame.jpeg?src=g4_instant #!secret instant_snap
        snapshot_caption: "\U0001f4f7 Вход 2"
        snapshot_chat_id: !secret tel_chat_id
        snapshot_photo_result: null
    - *send_snapshot_photo
    - *retry_snapshot_photo_if_needed
