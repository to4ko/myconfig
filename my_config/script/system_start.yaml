  system_start:
    alias: System start script
    sequence:
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ states(''sensor.local_ip'') == ''192.168.1.34'' }}'
        sequence:
        - action: switch.turn_on
          target:
            entity_id: switch.system_backup_lead
      default:
      - action: switch.turn_on
        target:
          entity_id: switch.system_main_lead
    - choose:
      - conditions:
        - condition: state
          entity_id: group.lights_t
          state: 'on'
        - condition: state
          entity_id: timer.main_light_t
          state: idle
        sequence:
        - action: timer.start
          target:
            entity_id: timer.main_light_t
      - conditions:
        - condition: state
          entity_id: group.lights_t
          state: 'off'
        sequence:
        - action: timer.cancel
          target:
            entity_id: timer.main_light_t
    - choose:
      - conditions:
        - condition: state
          entity_id: fan.esp32_node_b_fan_t
          state: 'on'
        - condition: state
          entity_id: timer.fan_t
          state: idle
        - condition: state
          entity_id: timer.short_fan_t
          state: idle
        sequence:
        - action: timer.start
          target:
            entity_id: timer.fan_t
      - conditions:
        - condition: state
          entity_id: fan.esp32_node_b_fan_t
          state: 'off'
        sequence:
        - action: timer.cancel
          target:
            entity_id: timer.fan_t
    - choose:
      - conditions:
        - condition: state
          entity_id: light.round_led_k
          state: 'on'
        - condition: state
          entity_id: timer.main_light_k
          state: idle
        sequence:
        - action: timer.start
          target:
            entity_id: timer.main_light_k
      - conditions:
        - condition: state
          entity_id: light.round_led_k
          state: 'off'
        sequence:
        - action: timer.cancel
          target:
            entity_id: timer.main_light_k
    - choose:
      - conditions:
        - condition: state
          entity_id: fan.esp32_node_b_fan_b
          state: 'on'
        - condition: state
          entity_id: timer.fan_b
          state: idle
        sequence:
        - action: timer.start
          target:
            entity_id: timer.fan_b
      - conditions:
        - condition: state
          entity_id: fan.esp32_node_b_fan_b
          state: 'off'
        sequence:
        - action: timer.cancel
          target:
            entity_id: timer.fan_b
    - choose:
      - conditions:
        - condition: state
          entity_id: fan.sonoff_pow_r2_1_bottom_fan
          state: 'on'
        - condition: state
          entity_id: timer.fan_bottom_b
          state: idle
        sequence:
        - action: timer.start
          target:
            entity_id: timer.fan_bottom_b
      - conditions:
        - condition: state
          entity_id: fan.sonoff_pow_r2_1_bottom_fan
          state: 'off'
        sequence:
        - action: timer.cancel
          target:
            entity_id: timer.fan_bottom_b
    - choose:
      - conditions:
        - condition: state
          entity_id: group.lights_main_hb
          state: 'on'
        - condition: state
          entity_id: timer.main_light_hb
          state: idle
        - condition: state
          entity_id: timer.main_light_short_hb
          state: idle
        sequence:
        - action: timer.start
          target:
            entity_id: timer.main_light_hb
      - conditions:
        - condition: state
          entity_id: group.lights_main_hb
          state: 'off'
        sequence:
        - action: timer.cancel
          target:
            entity_id: timer.main_light_hb
    - choose:
      - conditions:
        - condition: state
          entity_id: group.lights_st
          state: 'on'
        - condition: state
          entity_id: timer.main_light_st
          state: idle
        sequence:
        - action: timer.start
          target:
            entity_id: timer.main_light_st
      - conditions:
        - condition: state
          entity_id: group.lights_st
          state: 'off'
        sequence:
        - action: timer.cancel
          target:
            entity_id: timer.main_light_st
    - choose:
      - conditions:
        - condition: state
          entity_id: light.d1mini_bed_leds_strip_dima
          state: 'on'
        - condition: state
          entity_id: timer.led_strip_bed_dima_v
          state: idle
        sequence:
        - action: timer.start
          target:
            entity_id: timer.led_strip_bed_dima_v
      - conditions:
        - condition: state
          entity_id: light.d1mini_bed_leds_strip_dima
          state: 'off'
        sequence:
        - action: timer.cancel
          target:
            entity_id: timer.led_strip_bed_dima_v
    - choose:
      - conditions:
        - condition: state
          entity_id: light.d1mini_bed_leds_strip_sandra
          state: 'on'
        - condition: state
          entity_id: timer.led_strip_bed_sandra_v
          state: idle
        sequence:
        - action: timer.start
          target:
            entity_id: timer.led_strip_bed_sandra_v
      - conditions:
        - condition: state
          entity_id: light.d1mini_bed_leds_strip_sandra
          state: 'off'
        sequence:
        - action: timer.cancel
          target:
            entity_id: timer.led_strip_bed_sandra_v
    - choose:
      - conditions:
        - condition: state
          entity_id: group.lights_b
          state: 'on'
        - condition: state
          entity_id: timer.main_light_b
          state: idle
        sequence:
        - action: timer.start
          target:
            entity_id: timer.main_light_b
      - conditions:
        - condition: state
          entity_id: group.lights_b
          state: 'off'
        sequence:
        - action: timer.cancel
          target:
            entity_id: timer.main_light_b
    - if:
      - condition: state
        entity_id: binary_sensor.0x00158d000232ddd6_contact
        state: 'off'
      then:
      - action: light.turn_off
        entity_id: light.esp32_node_hs_toilet
    - action: light.turn_off
      entity_id: light.esp32_strip_1s_wadrobe_hb_rgb, light.esp32_strip_1s_entrance_hb_rgb, light.mono_strip_1_light,
        light.esp32_node_k_light
      data:
        transition: 30
    - action: script.washing_machine_state
    - if:
      - condition: state
        entity_id: switch.system_security_mode
        state: 'on'
      then:
      - action: script.turn_on
        entity_id: script.away_mode_on
    - action: homeassistant.update_entity
      entity_id:
      - sensor.start_time_cmd
      - sensor.errors_during_boot
      - sensor.warnings_during_boot
    - if:
      - condition: template
        value_template: |-
          {%- set datanames = namespace(sw_un=[]) -%} {%- for item in states.switch if ( ( item.state == 'unknown' and '_restart_key' in item.entity_id) )-%}
            {%- set datanames.sw_un = datanames.sw_un + [item.entity_id] -%}
          {%- endfor %} {%- set num_sw_un = datanames.sw_un | length %} {%- set sw_un = datanames.sw_un | join(', ') %} {{ num_sw_un|int >0 }}
      then:
      - action: switch.turn_on
        data:
          entity_id: |-
            {%- set datanames = namespace(sw_un=[]) -%} {%- for item in states.switch if ( ( item.state == 'unknown' and '_restart_key' in item.entity_id) )-%}
              {%- set datanames.sw_un = datanames.sw_un + [item.entity_id] -%}
            {%- endfor %} {%- set num_sw_un = datanames.sw_un | length %} {%- set sw_un = datanames.sw_un | join(', ') %} {{ sw_un }}
    - wait_for_trigger:
      - platform: state
        entity_id: binary_sensor.bottom_lock, binary_sensor.top_lock
      timeout:
        seconds: 10
      continue_on_timeout: true
    - action: script.turn_on
      entity_id: script.domofon_locks_indicator
    - if:
      - condition: state
        entity_id: binary_sensor.presence_b
        state: 'on'
      then:
      - action: timer.cancel
        entity_id: timer.main_light_b
    - if:
      - condition: state
        entity_id: binary_sensor.presence_t
        state: 'on'
      then:
      - action: timer.cancel
        entity_id: timer.main_light_t

